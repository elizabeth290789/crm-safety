<section class="security-icons-block" aria-label="Разделы безопасности Bitrix24">
  <style>
    .security-icons-block {
      --security-blue: #3277fd;
      --security-blue-hover: #1f63f0;
      --security-glow: rgba(50, 119, 253, 0.18);

      width: 100%;
      box-sizing: border-box;
      padding: 34px 20px;
      font-family: Montserrat, Arial, sans-serif;
    }

    .security-icons-block,
    .security-icons-block * {
      box-sizing: border-box;
    }

    .security-icons-block__grid {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: start;
      justify-items: center;
      gap: 34px 28px;
    }

    .security-icons-block__item {
      width: 100%;
      min-height: 154px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      color: var(--security-blue);
      text-decoration: none;
      cursor: pointer;
      outline: none;
      transition: color 0.22s ease, transform 0.22s ease, filter 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .security-icons-block__item:hover,
    .security-icons-block__item:focus-visible {
      color: var(--security-blue-hover);
      filter: drop-shadow(0 8px 18px var(--security-glow));
      transform: translateY(-2px);
    }

    .security-icons-block__item:focus-visible {
      border-radius: 18px;
      box-shadow: 0 0 0 3px rgba(50, 119, 253, 0.18);
    }

    .security-icons-block__icon-container {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
    }

    .security-icons-block__icon {
      width: 60px;
      height: 60px;
      display: block;
      color: currentColor;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.22s ease;
    }

    .security-icons-block__label {
      max-width: 210px;
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      font-weight: 600;
      font-size: 18px;
      line-height: 1.3;
      color: currentColor;
      text-align: center;
      letter-spacing: 0;
    }

    @media (max-width: 1024px) {
      .security-icons-block {
        padding: 30px 18px;
      }

      .security-icons-block__grid {
        max-width: 760px;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 32px 26px;
      }
    }

    @media (max-width: 767px) {
      .security-icons-block__grid {
        max-width: 520px;
        grid-template-columns: repeat(2, minmax(150px, 1fr));
        gap: 30px 20px;
      }

      .security-icons-block__item {
        min-height: 146px;
        gap: 16px;
      }

      .security-icons-block__icon-container {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
      }

      .security-icons-block__icon {
        width: 56px;
        height: 56px;
      }

      .security-icons-block__label {
        font-size: 17px;
      }
    }

    @media (max-width: 520px) {
      .security-icons-block {
        padding: 24px 16px;
      }

      .security-icons-block__grid {
        max-width: 320px;
        grid-template-columns: 1fr;
        gap: 26px;
      }

      .security-icons-block__item {
        min-height: auto;
        gap: 14px;
      }
    }
  </style>

  <div class="security-icons-block__grid">
    <a class="security-icons-block__item" href="https://www.bitrix24.ru/security/#nadejnost" target="_blank" rel="noopener">
      <span class="security-icons-block__icon-container" aria-hidden="true">
        <svg class="security-icons-block__icon" viewBox="0 0 72 72" focusable="false">
          <rect x="14" y="12" width="44" height="16" rx="4.5"></rect>
          <rect x="14" y="44" width="44" height="16" rx="4.5"></rect>
          <path d="M24 28v16"></path>

        <svg class="security-icons-block__icon" viewBox="0 0 72 72" focusable="false">
          <path d="M36 8l24 9v17c0 15.5-9.8 26.4-24 32-14.2-5.6-24-16.5-24-32V17l24-9z"></path>

        <svg class="security-icons-block__icon" viewBox="0 0 72 72" focusable="false">
          <path d="M24 25l-13 11 13 11"></path>
          <path d="M48 25l13 11-13 11"></path>
          <path d="M42 17L30 55"></path>
          <rect x="23" y="36" width="26" height="20" rx="5"></rect>
          <path d="M29 36v-7a7 7 0 0 1 14 0v7"></path>

      <span class="security-icons-block__icon-container" aria-hidden="true">
        <svg class="security-icons-block__icon" viewBox="0 0 72 72" focusable="false">
          <path d="M20 8h22l12 12v44H20z"></path>

        <svg class="security-icons-block__icon" viewBox="0 0 72 72" focusable="false">
          <path d="M7 36s10.5-18 29-18 29 18 29 18-10.5 18-29 18S7 36 7 36z"></path>

  </div>
